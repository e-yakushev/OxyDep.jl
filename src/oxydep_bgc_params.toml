# OXYDEP BGC model parameters — used by both pure BGC and Ci_ modes
# Rates are in 1/day (converted to 1/s internally)

[PHY]
initial_photosynthetic_slope = 0.1953  # 1/(W/m²)/day
Iopt = 80.0        # Optimal irradiance (W/m²)
alphaI = 1.8       # Initial slope of PI-curve (1/d/(W/m²))
betaI = 5.2e-4     # Photoinhibition parameter (1/d/(W/m²))
gammaD = 0.71      # Adaptation to daylength (-)
Max_uptake = 1.85   # Maximum nutrient uptake rate (1/d)
Knut = 0.8         # Half-saturation for NUT uptake (nd)
r_phy_nut = 0.10   # Specific respiration rate (1/d)
r_phy_pom = 0.15   # Specific mortality rate (1/d)
r_phy_dom = 0.17   # Specific excretion rate (1/d)

[HET]
r_phy_het = 0.8    # Max grazing rate on PHY (1/d)
Kphy = 0.1         # Half-sat for grazing on PHY (nd)
r_pom_het = 0.7    # Max grazing rate on POM (1/d)
Kpom = 2.0         # Half-sat for grazing on POM (nd)
Uz = 0.6           # Food absorbency (nd)
Hz = 0.5           # Ratio diss./part. excretes (nd)
r_het_nut = 0.15   # Respiration rate (1/d)
r_het_pom = 0.10   # Mortality rate (1/d)

[POM]
r_pom_nut_oxy = 0.05  # Oxic decay rate (1/d)
r_pom_dom = 0.10       # Decomposition rate (1/d)

[DOM]
r_dom_nut_oxy = 0.15   # Oxic decay rate (1/d)

[O2]
O2_suboxic = 20.0       # Oxic/suboxic threshold (mmol/m³)
r_pom_nut_nut = 0.005   # POM denitrification rate (1/d)
r_dom_nut_nut = 0.003   # DOM denitrification rate (1/d)

[stoichiometry]
OtoN = 8.625   # Redfield O:N ratio (nd)
CtoN = 6.625   # Redfield C:N ratio (nd)
NtoN = 5.3     # Richards denitrification ratio (nd)
NtoB = 0.016   # N to biomass conversion (nd)

[sinking]
P = 1.0      # PHY sinking speed (m/d)
HET = 4.0    # HET sinking speed (m/d)
POM = 9.0    # POM sinking speed (m/d)

[sediment]
Trel = 86400.0       # Relaxation time for sediment exchange (s)
b_O2_ox = 5.0        # O₂ flux at SWI, oxic (mmol/m²/d)
b_O2_subox = 10.0    # O₂ flux at SWI, suboxic (mmol/m²/d)
b_NUT_ox = -3.0      # NUT flux at SWI, oxic (mmol/m²/d)
b_NUT_subox = 7.0    # NUT flux at SWI, suboxic (mmol/m²/d)
b_DOM_ox = -2.0      # DOM flux at SWI, oxic (mmol/m²/d)
b_DOM_subox = -10.0  # DOM flux at SWI, suboxic (mmol/m²/d)
bu = 0.1           # Burial coefficient (nd)
windspeed = 5.0      # Wind speed at 10 m (m/s)
